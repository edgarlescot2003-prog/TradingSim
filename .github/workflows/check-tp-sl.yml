name: Verification TP/SL et liquidation

# S'execute meme quand aucun utilisateur n'a l'app ouverte : verifie tous les
# paliers Take Profit / Stop Loss actifs contre le prix courant et execute
# ceux qui sont declenches, PUIS verifie la liquidation automatique par marge
# de maintenance sur toutes les positions a levier (scripts/check_liquidation.py).
# Meme modele que la sauvegarde nocturne (.github/workflows/backup.yml).
# Necessite le meme secret DATABASE_URL (deja configure, voir backups/README.md).
#
# L'ordre des deux steps est volontaire et fait office de regle de priorite :
# le TP/SL (action volontaire de l'utilisateur) est toujours verifie avant la
# liquidation, pour qu'une position qui declenche les deux au meme run sorte
# d'abord par son palier plutot que par une liquidation forcee.
#
# Ne committe rien dans le depot (contrairement a la sauvegarde) : toutes
# les modifications vont directement dans Supabase.

on:
  # Toutes les 15 min en théorie ; en pratique GitHub ne le lance que toutes
  # les 3 à 5 h (bridage des crons planifiés, constaté le 24/09/2026). Réactivé
  # le 24/09/2026 après durcissement : coupe-circuit propre à l'IP GitHub,
  # snapshot Admin via le batch (au plus 1/h), jamais de prix daté pour TP/SL
  # et liquidation.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # bouton "Run workflow" manuel dans l'onglet Actions

permissions:
  contents: read

jobs:
  check-tp-sl:
    runs-on: ubuntu-latest
    env:
      TS_DIAG_LOG: "1"
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Seulement les dépendances nécessaires à ce script (pas tout
      # requirements.txt : streamlit/plotly ne servent à rien ici, voir la
      # panne ModuleNotFoundError du workflow de sauvegarde pour le contexte
      # de cette règle) — mêmes versions que requirements.txt.
      - name: Installer les dépendances
        run: pip install yfinance==0.2.66 sqlalchemy==2.0.43 "psycopg[binary]==3.3.4" python-dotenv==1.1.1

      - name: Vérifier et exécuter les paliers TP/SL déclenchés
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.check_tp_sl

      - name: Vérifier et exécuter les liquidations automatiques
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.check_liquidation

      - name: Enregistrer les snapshots Admin News
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.record_admin_snapshots

      # Pré-chargement des prix indicatifs des listes Trading : ne fait des
      # requêtes qu'au premier passage de chaque jour UTC (~24 requêtes
      # espacées), rien ensuite. Filet de sécurité conservé dans l'app (première
      # visite d'une liste) si ce step ne tourne pas. Voir
      # scripts/refresh_daily_lists.py.
      - name: Pré-charger les listes Trading (une fois par jour)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.refresh_daily_lists
